<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Phone: Friendly 19.5:9/9:19.5 aspect ratio & easy controls hook -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redirecting to Google Gemini...</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #4285f4;
            --accent-hover: #5a95f5;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Mobile touch optimization */
            touch-action: manipulation;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        p {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 1.5rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(66, 133, 244, 0.2);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s, transform 0.1s;
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .hints {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h1>Taking you to Gemini</h1>
        <p>Redirecting automatically in <span id="countdown">3</span> seconds...</p>
        
        <!-- Manual Action Button (PC & Mobile fallback/control) -->
        <a href="https://gemini.google.com" id="redirect-btn" class="btn">Click here if not redirected</a>

        <div class="hints" id="control-hints">
            <!-- PC: Keybinds / Mouse Tweaks | Mobile: Touch info -->
            PC: Press [Enter] to go now, [Esc] to cancel. | Mobile: Tap button anytime.
        </div>
    </div>

    <script>
        const targetUrl = "https://gemini.google.com";
        let timeLeft = 3;
        const countdownEl = document.getElementById("countdown");
        
        // Automatic redirection countdown loop
        const countdownTimer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                window.location.href = targetUrl;
            }
        }, 1000);

        // PC Controls: Keybinds & Mouse Tweaks
        window.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                // Instant redirect on Enter key
                window.location.href = targetUrl;
            } else if (e.key === "Escape") {
                // Cancel redirection on Escape key
                clearInterval(countdownTimer);
                document.querySelector("h1").textContent = "Redirection Cancelled";
                document.querySelector("p").textContent = "You can stay here or click below when ready.";
                document.getElementById("spinner").style.display = "none";
            }
        });

        // Mobile Controls / Touch handling hooks
        const btn = document.getElementById("redirect-btn");
        btn.addEventListener("touchstart", () => {
            // Immediate trigger hook for mobile touch controls
            window.location.href = targetUrl;
        }, { passive: true });
    </script>
</body>
</html>
